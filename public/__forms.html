<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularios</title></head>
<body>
<!-- Registro del formulario para Netlify Forms. El formulario visible vive en /contacto y envía aquí por fetch. -->
<form name="contacto" method="POST" data-netlify="true" netlify-honeypot="empresa-web" hidden>
  <input type="hidden" name="form-name" value="contacto">
  <input name="empresa-web">
  <input name="nombre">
  <input name="email" type="email">
  <input name="telefono">
  <input name="servicio">
  <textarea name="mensaje"></textarea>
</form>
</body>
</html>
